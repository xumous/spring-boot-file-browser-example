<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>杭州天气预报</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.5rem;
        }

        .loading i {
            margin-right: 10px;
        }

        .error {
            text-align: center;
            padding: 40px;
            background: rgba(255, 100, 100, 0.9);
            color: white;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .weather-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .weather-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .weather-card.today {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #4dabf7;
            grid-column: span 2;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .day-date {
            display: flex;
            flex-direction: column;
        }

        .day {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a2980;
        }

        .date {
            font-size: 1rem;
            color: #666;
            margin-top: 5px;
        }

        .weather-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4dabf7, #1a2980);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
        }

        .temperature {
            font-size: 3rem;
            font-weight: 700;
            color: #1a2980;
            margin: 15px 0;
            text-align: center;
        }

        .weather-desc {
            text-align: center;
            font-size: 1.4rem;
            color: #444;
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            background: rgba(77, 171, 247, 0.1);
            padding: 10px 15px;
            border-radius: 10px;
        }

        .detail-item i {
            color: #1a2980;
            margin-right: 10px;
            font-size: 1.2rem;
            width: 25px;
        }

        .detail-value {
            font-weight: 600;
            color: #333;
        }

        .detail-label {
            color: #666;
            font-size: 0.9rem;
            margin-top: 3px;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: white;
            font-size: 0.9rem;
            opacity: 0.8;
            padding: 20px;
        }

        .api-status {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .weather-cards {
                grid-template-columns: 1fr;
            }

            .weather-card.today {
                grid-column: span 1;
            }

            .header h1 {
                font-size: 2.2rem;
            }

            .temperature {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-cloud-sun"></i> 杭州天气预报</h1>
        <p>未来7天天气情况，数据实时更新</p>
    </div>

    <div class="loading" id="loading">
        <i class="fas fa-spinner fa-spin"></i> 正在获取天气数据...
    </div>

    <div class="error" id="error">
        <h3><i class="fas fa-exclamation-triangle"></i> 获取天气数据失败</h3>
        <p id="error-message">请检查网络连接或稍后再试</p>
    </div>

    <div class="weather-cards" id="weather-cards">
        <!-- 天气卡片将在这里动态生成 -->
    </div>

    <div class="footer">
        <p>数据来源：天气API • 最后更新：<span id="update-time"></span></p>
        <div class="api-status">
            <i class="fas fa-satellite"></i> API状态:
            <span id="api-status">等待请求</span>
        </div>
    </div>
</div>

    document.addEventListener("DOMContentLoaded", function () {
        const weatherCards = document.getElementById("weather-cards");
        const loading = document.getElementById("loading");
        const errorDiv = document.getElementById("error");
        const errorMessage = document.getElementById("error-message");
        const apiStatus = document.getElementById("api-status");
        const updateTime = document.getElementById("update-time");

        // 原始API URL
        const apiUrl =
            "http://api.k780.com/?app=weather.future&weaId=94&&appkey=10003&sign=b59bc3ef6191eb9f747dd4e83c99f2a4&format=json";

        // 使用CORS代理绕过浏览器限制
        // 注意：在生产环境中，建议使用自己的代理服务器或确保API支持CORS
        const proxyUrl = "https://api.allorigins.win/get?url=";
        const targetUrl = encodeURIComponent(apiUrl);

        // 获取天气数据
        async function fetchWeatherData() {
            try {
                loading.style.display = "block";
                errorDiv.style.display = "none";
                apiStatus.textContent = "请求中...";
                apiStatus.style.color = "#ff9800";

                // 尝试通过代理获取数据
                const response = await fetch(proxyUrl + targetUrl);

                if (!response.ok) {
                    throw new Error(`网络请求失败: ${response.status}`);
                }

                const data = await response.json();

                // 解析返回的数据
                const weatherData = JSON.parse(data.contents);

                if (weatherData.success !== "1") {
                    throw new Error("API返回数据异常");
                }

                apiStatus.textContent = "在线";
                apiStatus.style.color = "#4CAF50";

                // 更新最后更新时间
                const now = new Date();
                updateTime.textContent = now.toLocaleString("zh-CN");

                // 渲染天气数据
                renderWeatherCards(weatherData.result);

                loading.style.display = "none";
            } catch (err) {
                console.error("获取天气数据失败:", err);
                errorMessage.textContent = err.message;
                errorDiv.style.display = "block";
                loading.style.display = "none";
                apiStatus.textContent = "离线";
                apiStatus.style.color = "#f44336";

                // 如果网络请求失败，使用示例数据

                    err.message.includes("网络请求失败") ||
                    err.message.includes("Failed to fetch")

        // 渲染天气卡片
        function renderWeatherCards(weatherData) {
            weatherCards.innerHTML = "";

            weatherData.forEach((day, index) => {
                const isToday = index === 0;
                const weatherIcon = getWeatherIcon(day.weather, day.weather_iconid);

                const card = document.createElement("div");
                card.className = `weather-card ${isToday ? "today" : ""}`;

                card.innerHTML = `
                        <div class="card-header">
                            <div class="day-date">
                                <div class="day">${day.week}</div>
                                <div class="date">${formatDate(day.days)}</div>
                            </div>
                            <div class="weather-icon">
                                ${weatherIcon}
                            </div>
                        </div>
                        
                        <div class="temperature">${day.temperature}</div>
                        <div class="weather-desc">${day.weather}</div>
                        
                        <div class="details">
                            <div class="detail-item">
                                <i class="fas fa-wind"></i>
                                <div>
                                    <div class="detail-value">${day.wind}</div>
                                    <div class="detail-label">风向/风力</div>
                                </div>
                            </div>
                            
                            <div class="detail-item">
                                <i class="fas fa-temperature-high"></i>
                                <div>
                                    <div class="detail-value">${day.temp_high
                }℃ / ${day.temp_low}℃</div>
                                    <div class="detail-label">最高/最低温度</div>
                                </div>
                            </div>
                            
                            <div class="detail-item">

                }</div>

                            </div>

                }</div>

                            </div>

        }

        // 根据天气状况获取图标
        function getWeatherIcon(weather, iconId) {
            const iconMap = {
                晴: '<i class="fas fa-sun"></i>',
                多云: '<i class="fas fa-cloud"></i>',
                阴: '<i class="fas fa-cloud"></i>',
                小雨: '<i class="fas fa-cloud-rain"></i>',
                中雨: '<i class="fas fa-cloud-showers-heavy"></i>',
                大雨: '<i class="fas fa-cloud-showers-heavy"></i>',
                雷阵雨: '<i class="fas fa-bolt"></i>',
                雪: '<i class="fas fa-snowflake"></i>',
            };

            // 尝试根据天气描述匹配图标
            for (const [key, icon] of Object.entries(iconMap)) {
                if (weather.includes(key)) {
                    return icon;
                }
            }

            // 默认图标
            return '<i class="fas fa-cloud-sun"></i>';
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString("zh-CN", {
                year: "numeric",
                month: "long",
                day: "numeric",
            });
        }

        // 初始加载数据
        fetchWeatherData();

        // 每10分钟自动更新数据
        setInterval(fetchWeatherData, 10 * 60 * 1000);
